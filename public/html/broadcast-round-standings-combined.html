<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>Broadcast Round Standings - Combined</title>
    <link href="/lib/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/lib/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/room-manager.js"></script>
    <script src="/js/vendor-config.js"></script>

    <link href="/css/fonts.css" rel="stylesheet">
    <link href="/css/broadcast-round-standings-all.css" rel="stylesheet">

    <style>
        body { overflow: hidden; }

        #standings-slider {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .standings-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .standings-page.active {
            display: block;
        }

        /* Page slide animations — per-layout via CSS vars. Default
           values match the TES horizontal slide; layouts can override
           via vendor-config (e.g. riftbound default 1v1 uses fade). */
        .standings-page.slide-in {
            display: block;
            animation:
                var(--standings-page-anim-in, slideInFromLeft)
                var(--standings-page-anim-duration, 1s)
                var(--standings-page-anim-easing, ease-in-out)
                forwards;
        }

        .standings-page.slide-out {
            display: block;
            animation:
                var(--standings-page-anim-out, slideOutToRight)
                var(--standings-page-anim-duration, 1s)
                var(--standings-page-anim-easing, ease-in-out)
                forwards;
        }

        @keyframes slideInFromLeft {
            from { transform: translateX(-100%); }
            to   { transform: translateX(0); }
        }

        @keyframes slideOutToRight {
            from { transform: translateX(0); }
            to   { transform: translateX(100%); }
        }

        /* Alt animations — opt in via --standings-page-anim-in/out vars. */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        @keyframes slideInFromBottom {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        @keyframes slideOutToTop {
            from { transform: translateY(0);    opacity: 1; }
            to   { transform: translateY(-40px); opacity: 0; }
        }

        /* Per-row reveal — used by layouts that opt into stagger cascade
           (currently riftbound default 1v1). Each row fades + slides up
           a few px; nth-child rules in the layout-scoped CSS dictate
           the per-row delay. */
        @keyframes rowReveal {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="container-fluid">
<img id="standings-bg" class="standings-bg-img" src="" alt="">
<video id="standings-bg-video" autoplay loop muted playsinline></video>
<!-- Optional character art layer — see -all-1.html for full comment. -->
<img id="standings-character" class="standings-character-img" src="" alt="">
<div id="standings-event-round" class="standings-event-round-el"></div>

<!-- Dynamic title + column headers. Hidden by default
     (`display: none` on the parent). A vendor-config layout that wants
     crisp browser-rendered titles instead of PSD-baked text in the
     frame PNG opts in by setting `--rb-stand-dynamic-headers: block`
     and re-exporting the frame without those text layers. Used by
     riftbound default 1v1 (Vancouver template). Inert for every
     other layout. -->
<div id="standings-dynamic-chrome">
    <div class="standings-title">STANDINGS</div>
    <!-- Bologna 1v1 has a 4th (RANK) column header; CSS positioning
         vars (--rb-stand-header-rank-*) already exist in vendor-config.
         Other vendors hide #standings-dynamic-chrome entirely via
         --rb-stand-dynamic-headers, so the extra div is inert there. -->
    <div class="standings-col-header standings-col-header-rank-left">RANK</div>
    <div class="standings-col-header standings-col-header-name-left">PLAYER</div>
    <div class="standings-col-header standings-col-header-record-left">RECORD</div>
    <div class="standings-col-header standings-col-header-legend-left">LEGEND</div>
    <div class="standings-col-header standings-col-header-name-right">PLAYER</div>
    <div class="standings-col-header standings-col-header-record-right">RECORD</div>
    <div class="standings-col-header standings-col-header-legend-right">LEGEND</div>
</div>
<!-- ──────────────────────────────────────────────────────────────────────
     FlyQuest 2v2 standings overlay. Entirely gated by
     body[data-vendor="flyquest"][data-player-count="2v2"] in the CSS — for
     every other vendor/player-count combo this block renders nothing
     (display:none on #fq-standings-overlay). Populated by
     broadcast-round-standings-combined.js when flyquest + 2v2 is active
     AND both group1/group2 assignments + standings data have arrived.
     Coords are PSD-driven: see broadcast-round-standings-all.css
     "FlyQuest 2v2 layout" block for the fixed pixel positions.
     All chrome (pills, portrait frames, name bars, record pills) is
     rendered as CSS divs so the entire bracket columns can be
     perspective-tilted as a unit (step 6 — tilt ±2.5deg).
     ────────────────────────────────────────────────────────────────────── -->
<div id="fq-standings-overlay">
    <!-- STANDINGS header pill stays flat (not tilted) — user spec. -->
    <div class="fq-standings-header"><span>STANDINGS</span></div>

    <!-- Left bracket (GROUP 1). The .fq-bracket-tilt wrapper is where the
         rotateY() transform is applied so the whole group rotates as a
         unit (pill + captains + rows) rather than each child individually. -->
    <div class="fq-bracket fq-bracket-left">
        <div class="fq-bracket-tilt fq-bracket-tilt-left">
            <div class="fq-group-pill"><span>GROUP 1</span></div>
            <div class="fq-captain fq-captain-1"><img class="fq-captain-img" src="" alt=""></div>
            <div class="fq-captain fq-captain-2"><img class="fq-captain-img" src="" alt=""></div>
            <div class="fq-team-rows" data-group="group1">
                <!-- Row 1 (rank 1 within group) — captains' team, no thumbs -->
                <div class="fq-team-row fq-team-row-spotlight" data-row="1">
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
                <!-- Rows 2/3/4 — compact with two thumbnails -->
                <div class="fq-team-row fq-team-row-compact" data-row="2">
                    <div class="fq-row-thumb fq-row-thumb-1"><img src="" alt=""></div>
                    <div class="fq-row-thumb fq-row-thumb-2"><img src="" alt=""></div>
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
                <div class="fq-team-row fq-team-row-compact" data-row="3">
                    <div class="fq-row-thumb fq-row-thumb-1"><img src="" alt=""></div>
                    <div class="fq-row-thumb fq-row-thumb-2"><img src="" alt=""></div>
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
                <div class="fq-team-row fq-team-row-compact" data-row="4">
                    <div class="fq-row-thumb fq-row-thumb-1"><img src="" alt=""></div>
                    <div class="fq-row-thumb fq-row-thumb-2"><img src="" alt=""></div>
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right bracket (GROUP 2) — mirrors the left bracket but uses right-
         side PSD coords. Tilt var flips sign so the two groups form a
         symmetric fan toward the camera. -->
    <div class="fq-bracket fq-bracket-right">
        <div class="fq-bracket-tilt fq-bracket-tilt-right">
            <div class="fq-group-pill"><span>GROUP 2</span></div>
            <div class="fq-captain fq-captain-1"><img class="fq-captain-img" src="" alt=""></div>
            <div class="fq-captain fq-captain-2"><img class="fq-captain-img" src="" alt=""></div>
            <div class="fq-team-rows" data-group="group2">
                <div class="fq-team-row fq-team-row-spotlight" data-row="1">
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
                <div class="fq-team-row fq-team-row-compact" data-row="2">
                    <div class="fq-row-thumb fq-row-thumb-1"><img src="" alt=""></div>
                    <div class="fq-row-thumb fq-row-thumb-2"><img src="" alt=""></div>
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
                <div class="fq-team-row fq-team-row-compact" data-row="3">
                    <div class="fq-row-thumb fq-row-thumb-1"><img src="" alt=""></div>
                    <div class="fq-row-thumb fq-row-thumb-2"><img src="" alt=""></div>
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
                <div class="fq-team-row fq-team-row-compact" data-row="4">
                    <div class="fq-row-thumb fq-row-thumb-1"><img src="" alt=""></div>
                    <div class="fq-row-thumb fq-row-thumb-2"><img src="" alt=""></div>
                    <div class="fq-row-name"><span class="fq-row-name-text"></span></div>
                    <div class="fq-row-record"><span class="fq-row-record-text"></span></div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Branded footer — for layouts that opt in via --rb-stand-footer-display
     (currently only riftbound default 1v1 / CSL Bologna). Static labels'
     content comes from CSS vars via ::before pseudo-elements; the dynamic
     round number is set by JS on #standings-footer-after-round. Inert
     for every other layout (CSS hides it via display: none default). -->
<div id="standings-footer">
    <span id="standings-footer-label-left"></span>
    <span id="standings-footer-after-round"></span>
    <span id="standings-footer-share"></span>
    <span id="standings-footer-hashtag"></span>
</div>
<div id="standings-slider">
    <!-- Page 4: Ranks 49-64 (off-screen left) -->
    <div class="standings-page" id="standings-page-4">
        <div id="standings-wrapper-4" class="standings-wrapper-el" data-start-rank="49">
        </div>
    </div>
    <!-- Page 3: Ranks 33-48 (off-screen left) -->
    <div class="standings-page" id="standings-page-3">
        <div id="standings-wrapper-3" class="standings-wrapper-el" data-start-rank="33">
        </div>
    </div>
    <!-- Page 2: Ranks 17-32 (off-screen left) -->
    <div class="standings-page" id="standings-page-2">
        <div id="standings-wrapper-2" class="standings-wrapper-el" data-start-rank="17">
        </div>
    </div>
    <!-- Page 1: Ranks 1-16 (visible) -->
    <div class="standings-page active" id="standings-page-1">
        <div id="standings-wrapper-1" class="standings-wrapper-el">
        </div>
    </div>
</div>
<script type="module" src="/js/broadcast-round-standings-combined.js"></script>
</body>
</html>
