<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>Broadcast Round Standings - All</title>
    <!-- Bootstrap 5 CSS -->
    <link href="/lib/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional Bootstrap 5 JS with Popper.js -->
    <script src="/lib/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <!-- Room Manager -->
    <script src="/js/room-manager.js"></script>
    <script src="/js/vendor-config.js"></script>

    <link href="/css/fonts.css" rel="stylesheet">
    <link href="/css/broadcast-round-standings-all.css" rel="stylesheet">

</head>
<body class="container-fluid">
<img id="standings-bg" src="" alt="">
<video id="standings-bg-video" autoplay loop muted playsinline></video>
<!-- Optional character art layer — sits above #standings-bg and below
     #standings-wrapper (data rows + panel chrome). Used when the bg
     PNG should NOT have the character baked in (e.g. character animates
     or is per-event swappable). JS loads the PNG via HEAD probe; if
     missing, the element is empty/invisible. -->
<img id="standings-character" src="" alt="">
<div id="standings-event-round"></div>
<div id="standings-wrapper">
    <!-- All 16 standings rows will be generated by JS -->
</div>
<script type="module" src="/js/broadcast-round-standings-all.js"></script>
</body>
</html>
