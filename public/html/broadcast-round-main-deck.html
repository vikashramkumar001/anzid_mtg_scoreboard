<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Deck Display</title>
    <!-- Bootstrap 5 CSS -->
    <link href="/lib/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional Bootstrap 5 JS with Popper.js -->
    <script src="/lib/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <!-- Room Manager -->
    <script src="/js/room-manager.js"></script>
    <script src="/js/vendor-config.js"></script>
    <link href="/css/fonts.css" rel="stylesheet">
    <link href="/css/broadcast-round-main-deck.css" rel="stylesheet">
</head>

<body class="container-fluid p-0">
    <!-- MTG Deck Display -->
    <div id="deck-display-mtg" style="display: none;">
        <div
            class="bg-image"
            style="height: 100vh;"
            id="mtg-bg-image"
        ></div>
        <div class="row" id="deck-display-details">
        </div>
        <div class="row" id="deck-display-container">
            <div id="main-deck-container">
            </div>
        </div>
    </div>

    <!-- MTG FlyQuest 2v2 Signature Decklist (two players per side) -->
    <!-- Shown when game=mtg + vendor=flyquest + playerCount=2v2. URL side
         `left`  → renders players 1 + 2 (team `player-name-left`, `-left-2`).
         URL side `right` → renders players 3 + 4 (`player-name-right`, `-right-2`).
         Cards come from /data/flyquest-2v2-decklist.json (keyed by slug),
         portraits come from /data/playerRoster.json. -->
    <div id="deck-display-mtg-fq2v2" style="display: none;">
        <div class="fq2v2-dl-bg" id="fq2v2-dl-bg"></div>
        <div class="fq2v2-dl-frame" id="fq2v2-dl-frame"></div>

        <div class="fq2v2-dl-player fq2v2-dl-slot-1">
            <img class="fq2v2-dl-portrait" id="fq2v2-dl-portrait-1" src="" alt="">
            <div class="fq2v2-dl-name" id="fq2v2-dl-name-1"></div>
            <img class="fq2v2-dl-card" id="fq2v2-dl-card-1" src="" alt="">
        </div>

        <div class="fq2v2-dl-player fq2v2-dl-slot-2">
            <img class="fq2v2-dl-portrait" id="fq2v2-dl-portrait-2" src="" alt="">
            <div class="fq2v2-dl-name" id="fq2v2-dl-name-2"></div>
            <img class="fq2v2-dl-card" id="fq2v2-dl-card-2" src="" alt="">
        </div>
    </div>

    <!-- Riftbound Deck Display -->
    <div id="deck-display-riftbound" style="display: none;">
        <div class="riftbound-dl-bg-video">
            <video id="riftbound-dl-video" autoplay loop muted playsinline
                src="/assets/animations/riftbound/decklist/frame/riftbound-scoreboard-frame-default-1v1.mp4"></video>
        </div>
        <div id="riftbound-dl-frame"></div>
        <div id="riftbound-dl-legend-card"><video id="riftbound-dl-legend-card-video" autoplay loop muted playsinline style="display:none;"></video><img id="riftbound-dl-legend-card-img" src="" alt=""></div>

        <div id="riftbound-dl-champion-card"><img id="riftbound-dl-champion-card-img" src="" alt=""></div>
        <div id="riftbound-deck-display-details"></div>
        <div id="riftbound-deck-display-legend-name"></div>
        <div id="riftbound-deck-display-container">
            <div id="riftbound-main-deck-container"></div>
        </div>
    </div>

    <!-- Vibes Deck Display -->
    <div id="deck-display-vibes" style="display: none;">
        <div
            class="bg-image"
            style="height: 100vh;"
            id="vibes-bg-image"
        ></div>
        <iframe
            src="http://localhost:1378/vibes/display/card/view/1"
            id="vibes-card-frame"
            frameborder="0">
        </iframe>
        <div class="row" id="vibes-deck-display-details">
        </div>
        <div class="row" id="vibes-deck-display-container">
            <div id="vibes-main-deck-container">
            </div>
        </div>
    </div>

    <!-- Star Wars Deck Display -->
    <div id="deck-display-starwars" style="display: none;">
        <div class="bg-image" id="starwars-bg-image"></div>
        <div id="starwars-deck-display-details">
        </div>
        <div id="starwars-deck-display-container">
            <div id="starwars-main-deck-container">
            </div>
        </div>
    </div>

    <script type="module" src="/js/broadcast-round-main-deck.js"></script>
</body>

</html>
