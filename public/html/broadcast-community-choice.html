    <script src="/socket.io/socket.io.js"></script>

    <link href="/css/fonts.css" rel="stylesheet">

<body>
<!-- UNLEASHED "Community Choice" — 4 match rows (left/right player plates, VS
     ornament, domain runes). The bg is the PSD truth composite (adjustment
     layers don't survive ag-psd re-compositing); every dynamic region is
     covered by the designer's own opaque row-plate PNGs (M1-M4 left/right,
     full-canvas), so the baked sample data never shows through. The gold
     "Selected" plate overlays a side's name area (winner state) — drawn at
     row 1 in the source art and shifted per row via translateY. -->
<div id="cc-stage">
    <img id="cc-bg" src="/assets/images/riftbound/community-choice/riftbound-community-choice-bg-uvs-unleashed-1v1.png" alt="">
    <div id="cc-rows"></div>
</div>
<script type="module" src="/js/broadcast-community-choice.js"></script>
</body>
