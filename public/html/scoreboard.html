<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <!-- Room Manager -->
    <script src="/js/room-manager.js"></script>
    <script src="/js/vendor-config.js"></script>
    <link href="/css/scoreboard.css" rel="stylesheet">

</head>
<body>

<!-- MTG Scoreboard -->
<div id="scoreboard-mtg" style="display: none;">
    <div class="mtg-frame"></div>
    <!-- Player portrait icons: src is stamped by scoreboard.js from the global
         roster (features/roster.js, data/playerRoster.json) via exact-name match
         on player-name-left/-left-2/-right/-right-2. Hidden by default
         (--mtg-icon-opacity: 0); flyquest 2v2 flips opacity + supplies per-icon
         top/left from mtg-scoreboard-frame-flyquest-2v2.psd. Icons without a
         matching roster entry are hidden via display:none inside applyIcon(). -->
    <img id="mtg-p1-icon" class="mtg-player-icon" src="" alt="">
    <img id="mtg-p2-icon" class="mtg-player-icon" src="" alt="">
    <img id="mtg-p3-icon" class="mtg-player-icon" src="" alt="">
    <img id="mtg-p4-icon" class="mtg-player-icon" src="" alt="">
    <div class="mtg-timer-wrapper">
        <div class="mtg-event-name" id="mtg-event-name"></div>
        <div class="mtg-event-round" id="mtg-event-round"></div>
        <div class="timer-container">
            <p id="timer" class="mtg-timer">00:00</p>
        </div>
    </div>
    <div class="header">
        <div class="background-left">
        </div>
        <div class="background-right">
        </div>
        <div id="poison-left" class="poison poison-left">
            <div id="player-poison-left" class="player-poison-left"></div>
        </div>
        <div id="poison-right" class="poison poison-right">
            <div id="player-poison-right" class="player-poison-right"></div>
        </div>
        <div class="background">
            <div class="scorebug">
                <div class="scorebug-life scorebug-left-life">
                    <div id="player-life-left" class="scorebug-life-score scorebug-left-life-score">-</div>
                    <div id="player-wins-leftw" class="scorebug-life-wins scorebug-left-life-wins">
                        <div id="scorebug-left-life-wins-1" class="scorebug-life-wins-dot"></div>
                        <div id="scorebug-left-life-wins-2" class="scorebug-life-wins-dot"></div>
                    </div>
                </div>
                <div class="scorebug-name scorebug-left-name">
                    <div id="player-name-left" class="scorebug-name-title scorebug-left-name-title">-</div>
                    <div id="player-name-left-2" class="scorebug-name-title scorebug-left-name-title scorebug-name-title-2 player-name-2"></div>
                    <div class="scorebug-name-data scorebug-left-name-data">
                        <span id="player-mana-symbols-left-symbols">
                        </span>
                        <span id="player-archetype-left"></span>
                        <span id="player-pronouns-left" class="player-pronouns"></span>
                    </div>
                </div>
                <div id="player-record-left" class="player-record player-record-left"></div>
                <div class="timer-spacer"></div>
                <div id="player-record-right" class="player-record player-record-right"></div>
                <div class="scorebug-name scorebug-right-name">
                    <div id="player-name-right" class="scorebug-name-title scorebug-right-name-title">-</div>
                    <div id="player-name-right-2" class="scorebug-name-title scorebug-right-name-title scorebug-name-title-2 player-name-2"></div>
                    <div class="scorebug-name-data scorebug-right-name-data">
                        <span id="player-pronouns-right" class="player-pronouns"></span>
                        <span id="player-archetype-right"></span>
                        <span id="player-mana-symbols-right-symbols">
                        </span>
                    </div>
                </div>
                <div class="scorebug-life scorebug-right-life">
                    <div id="player-life-right" class="scorebug-life-score scorebug-right-life-score">-</div>
                    <div id="player-wins-righte" class="scorebug-life-wins scorebug-right-life-wins">
                        <div id="scorebug-right-life-wins-1" class="scorebug-life-wins-dot"></div>
                        <div id="scorebug-right-life-wins-2" class="scorebug-life-wins-dot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="body">
        <div class="background">
        </div>
    </div>
    <div class="footer">
        <div class="background">
            <div class="chyron">
                <div class="chyron_commentary">
                    <span id="miscellaneous-details"></span>
                </div>
                <div class="chyron_event">
                    <span id="event-name">-</span>&nbsp;&nbsp;|&nbsp;&nbsp;
                    <span id="event-round">-</span>&nbsp;&nbsp;|&nbsp;&nbsp;
                    <span id="event-format">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Card View Overlays (card-id 1 = left, card-id 2 = right).
         Base state is opacity 0 + translateY(--mtg-card-slide-offset) + rotateY(0);
         .visible animates to translateY(0) + rotateY(--mtg-card-tilt) + opacity 1.
         Durations default to 0ms so non-FQ MTG vendors snap on/off; the flyquest
         block in vendor-config.js flips the durations to enable the animation. -->
    <div class="mtg-card-overlay mtg-card-overlay-left" id="mtg-card-overlay-left">
        <!-- Two stacked <img> slots per overlay for sequenced crossfade (see
             showMtgCardOverlay in scoreboard.js). The first keeps the legacy
             id so handleCardViewOnScoreboard's lookup + null-check still work
             for routing; both carry .mtg-card-slot for CSS + JS targeting. -->
        <img id="mtg-card-overlay-img-left" class="mtg-card-slot" src="" alt="">
        <img class="mtg-card-slot" src="" alt="">
    </div>
    <div class="mtg-card-overlay mtg-card-overlay-right" id="mtg-card-overlay-right">
        <img id="mtg-card-overlay-img-right" class="mtg-card-slot" src="" alt="">
        <img class="mtg-card-slot" src="" alt="">
    </div>

    <!-- Background dim layer — full-viewport fixed layer with a linear-gradient
         background that's transparent on the left, feathers into --mtg-card-dim-color
         on the right where the card sits. Fades in/out on .visible, sync'd with the
         card overlay. Defaults to a no-op (transparent gradient) for non-FQ vendors. -->
    <div id="mtg-card-dim"></div>
</div>

<!-- Riftbound Scoreboard -->
<div id="scoreboard-riftbound" style="display: none;">
    <div class="riftbound-container">
        <div class="riftbound-bg-video">
            <video id="riftbound-frame-video" autoplay loop muted playsinline src="/assets/animations/riftbound/scoreboard/frame/riftbound-scoreboard-frame-default-1v1.mp4"></video>
        </div>
        <div class="riftbound-frame"></div>
        <!-- Player portrait icons: same roster machinery as the mtg block above.
             Hidden by default (--rb-icon-opacity: 0); positions need to come
             from a riftbound frame PSD once one exists (DSG 2v2 is PNG-only
             today). Coords would be supplied via --rb-pN-icon-top/-left in
             the relevant riftbound vendor block. -->
        <img id="rb-p1-icon" class="rb-player-icon" src="" alt="">
        <img id="rb-p2-icon" class="rb-player-icon" src="" alt="">
        <img id="rb-p3-icon" class="rb-player-icon" src="" alt="">
        <img id="rb-p4-icon" class="rb-player-icon" src="" alt="">
        <!-- Shared score tracker (riftbound-only). Bubbles rendered by
             scoreboard.js based on player-life-{left,right} + battlefield
             selections (Aspirant's Climb extends max). Default vendor
             positions at top center of the bar. -->
        <div class="riftbound-score-tracker" id="riftbound-score-tracker"></div>
        <div class="riftbound-player-record-wrapper riftbound-player-record-left">
            <div id="player-record-left" class="riftbound-player-record"></div>
        </div>
        <div class="riftbound-player-record-wrapper riftbound-player-record-right">
            <div id="player-record-right" class="riftbound-player-record"></div>
        </div>
        <!-- XP tracker (riftbound-only) — mirrors the player-record position
             on the chrome's PSD. Only displayed when value > 0. -->
        <div class="riftbound-player-xp-wrapper riftbound-player-xp-left" id="riftbound-player-xp-wrapper-left">
            <div class="riftbound-player-xp-label">XP</div>
            <div id="player-xp-left" class="riftbound-player-xp"></div>
        </div>
        <div class="riftbound-player-xp-wrapper riftbound-player-xp-right" id="riftbound-player-xp-wrapper-right">
            <div class="riftbound-player-xp-label">XP</div>
            <div id="player-xp-right" class="riftbound-player-xp"></div>
        </div>
        <div class="riftbound-player-life-wrapper riftbound-player-life-left">
            <div id="player-life-left" class="riftbound-player-life"></div>
        </div>
        <div class="riftbound-player-life-wrapper riftbound-player-life-right">
            <div id="player-life-right" class="riftbound-player-life"></div>
        </div>
        <div class="riftbound-player-name-wrapper riftbound-player-name-left">
            <div id="player-name-left" class="riftbound-player-name"></div>
            <div id="player-name-left-2" class="riftbound-player-name riftbound-player-name-2 player-name-2"></div>
        </div>
        <div class="riftbound-player-name-wrapper riftbound-player-name-right">
            <div id="player-name-right" class="riftbound-player-name"></div>
            <div id="player-name-right-2" class="riftbound-player-name riftbound-player-name-2 player-name-2"></div>
        </div>
        <div class="riftbound-player-wins-wrapper riftbound-player-wins-left">
            <div id="riftbound-wins-left-1" class="riftbound-wins-pip"></div>
            <div id="riftbound-wins-left-2" class="riftbound-wins-pip"></div>
        </div>
        <div class="riftbound-player-wins-wrapper riftbound-player-wins-right">
            <div id="riftbound-wins-right-1" class="riftbound-wins-pip"></div>
            <div id="riftbound-wins-right-2" class="riftbound-wins-pip"></div>
        </div>
        <div class="riftbound-player-legend-background riftbound-player-legend-background-left"></div>
        <div class="riftbound-player-legend-background riftbound-player-legend-background-right"></div>
        <!-- Inner team-A / team-B legend slots (P2 / P4) — only visible in
             vendor/playerCount combos that opt in via --rb-legend-2-display
             (DSG 2v2 player-info hub). Default display: none. -->
        <div class="riftbound-player-legend-background riftbound-player-legend-background-left-2"></div>
        <div class="riftbound-player-legend-background riftbound-player-legend-background-right-2"></div>
        <div class="riftbound-player-legend-over-frame riftbound-player-legend-over-frame-left"></div>
        <div class="riftbound-player-legend-over-frame riftbound-player-legend-over-frame-right"></div>
        <div class="riftbound-player-legend-over-frame riftbound-player-legend-over-frame-left-2"></div>
        <div class="riftbound-player-legend-over-frame riftbound-player-legend-over-frame-right-2"></div>
        <div class="riftbound-player-legend-wrapper riftbound-player-legend-left">
            <div id="player-legend-left" class="riftbound-player-legend"></div>
        </div>
        <div class="riftbound-player-legend-wrapper riftbound-player-legend-right">
            <div id="player-legend-right" class="riftbound-player-legend"></div>
        </div>
        <!-- Hidden text holders for inner legend names (P2/P4) — kept so
             scoreboard.js text-update path can write to them without errors;
             not visible by default. -->
        <div class="riftbound-player-legend-wrapper riftbound-player-legend-left-2" style="display:none;">
            <div id="player-legend-left-2" class="riftbound-player-legend"></div>
        </div>
        <div class="riftbound-player-legend-wrapper riftbound-player-legend-right-2" style="display:none;">
            <div id="player-legend-right-2" class="riftbound-player-legend"></div>
        </div>
        <div class="riftbound-player-champion-wrapper riftbound-player-champion-left">
            <div id="player-champion-left" class="riftbound-player-champion"></div>
        </div>
        <div class="riftbound-player-champion-wrapper riftbound-player-champion-right">
            <div id="player-champion-right" class="riftbound-player-champion"></div>
        </div>
        <div class="riftbound-player-runes-wrapper riftbound-player-runes-left">
            <div id="player-runes-left" class="riftbound-player-runes"></div>
        </div>
        <div class="riftbound-player-runes-wrapper riftbound-player-runes-right">
            <div id="player-runes-right" class="riftbound-player-runes"></div>
        </div>
        <div class="riftbound-player-battlefield-background riftbound-player-battlefield-background-left"></div>
        <div class="riftbound-player-battlefield-background riftbound-player-battlefield-background-right"></div>
        <div class="riftbound-player-battlefield-wrapper riftbound-player-battlefield-left">
            <div id="player-battlefield-left" class="riftbound-player-battlefield"></div>
        </div>
        <div class="riftbound-player-battlefield-wrapper riftbound-player-battlefield-right">
            <div id="player-battlefield-right" class="riftbound-player-battlefield"></div>
        </div>
        <div class="riftbound-event-name-wrapper">
            <div id="event-name" class="riftbound-event-name"></div>
        </div>
        <div class="riftbound-event-round-wrapper">
            <div id="event-round" class="riftbound-event-round"></div>
        </div>
        <div class="riftbound-timer-wrapper">
            <div class="timer-container">
                <p id="timer" class="riftbound-timer">00:00</p>
            </div>
        </div>
        <!-- Card View Overlays. Two paths share this DOM:
             1v1: snap on/off via `overlay.style.display = block/none`. The
                  first .riftbound-card-slot retains the legacy id, so the
                  existing `img.src = url` lookup keeps working. The second
                  slot is hidden by CSS in 1v1 (display:none on :nth-child(2)).
             2v2: animated path mirroring MTG flyquest (slide+fade+tilt-in,
                  sequenced two-slot crossfade, drop-shadow halo). Gated by
                  body[data-player-count="2v2"] in scoreboard.css and a
                  currentPlayerCount === '2v2' branch in scoreboard.js. Both
                  slots stack at top:0/left:0 and toggle .active for opacity. -->
        <div class="riftbound-card-overlay riftbound-card-overlay-left" id="riftbound-card-overlay-left">
            <img id="riftbound-card-overlay-img-left" class="riftbound-card-slot" src="/assets/images/riftbound/cards/riftbound-card-back.jpg" alt="">
            <img class="riftbound-card-slot" src="" alt="">
        </div>
        <div class="riftbound-card-overlay riftbound-card-overlay-right" id="riftbound-card-overlay-right">
            <img id="riftbound-card-overlay-img-right" class="riftbound-card-slot" src="/assets/images/riftbound/cards/riftbound-card-back.jpg" alt="">
            <img class="riftbound-card-slot" src="" alt="">
        </div>

        <!-- Background dim layer for the 2v2 card view — full-viewport fixed
             layer with a feathered gradient (transparent on the left, fades
             to --rb-card-dim-color on the right where the card sits). Fades
             in/out on .visible, sync'd with the card overlay. Defaults to a
             no-op (transparent + 0px blur) for non-DSG-2v2 vendors so the
             element costs nothing visually outside its target combo. -->
        <div id="riftbound-card-dim"></div>

        <!-- Showdown Might tracker — center-bottom overlay that slides in
             from below when the operator triggers it from master-control.
             Shows the active battlefield (1, 2, or Baron Pit) + left and
             right might values. Hidden by default; `.visible` triggers the
             slide-in animation. Painted via scoreboard.js based on the
             showdown-* control data fields. -->
        <div class="riftbound-showdown-tracker" id="riftbound-showdown-tracker">
            <!-- Hextech decorative gold-corner frame pieces (PSD layers
                 "Hextech Left"/"Hexctech Right"; their names are
                 swapped in the PSD — the asset paths use the visually
                 correct left/right). -->
            <div class="riftbound-showdown-hextech riftbound-showdown-hextech-left"></div>
            <div class="riftbound-showdown-hextech riftbound-showdown-hextech-right"></div>
            <!-- Gold "SHOWDOWN" pill at top center (PSD: Showdown Icon
                 117×24 at y=1008-1032). -->
            <div class="riftbound-showdown-label">SHOWDOWN</div>
            <div class="riftbound-showdown-might riftbound-showdown-might-left">
                <div class="riftbound-showdown-might-value" id="riftbound-showdown-might-left-value">0</div>
            </div>
            <div class="riftbound-showdown-bf">
                <div class="riftbound-showdown-bf-art" id="riftbound-showdown-bf-art"></div>
                <div class="riftbound-showdown-bf-name" id="riftbound-showdown-bf-name"></div>
            </div>
            <div class="riftbound-showdown-might riftbound-showdown-might-right">
                <div class="riftbound-showdown-might-value" id="riftbound-showdown-might-right-value">0</div>
            </div>
        </div>

        <!-- 2v2 battlefield strip (lower-third, 4 cards). Hidden by default
             (--rb-battlefields-row-display: none); DSG 2v2 opts in by flipping
             that var to `flex`. Slot keys mirror the per-side `player-battlefield-{slot}`
             fields on the match payload AND the server's battlefieldVisibility
             map — same key on both ends, no lookup table. The .riftbound-bf-img
             is the cropped card art (slot is overflow:hidden so only the middle
             band shows); the .riftbound-bf-label overlays the band as a caption.
             updateRiftboundBattlefieldsRow() in scoreboard.js fills these from
             match data + visibility flags. -->
        <div class="riftbound-bf-row">
            <div class="riftbound-bf-slot" data-slot="left">
                <img class="riftbound-bf-img" src="" alt="">
                <div class="riftbound-bf-label"></div>
            </div>
            <div class="riftbound-bf-slot" data-slot="left-2">
                <img class="riftbound-bf-img" src="" alt="">
                <div class="riftbound-bf-label"></div>
            </div>
            <div class="riftbound-bf-slot" data-slot="right">
                <img class="riftbound-bf-img" src="" alt="">
                <div class="riftbound-bf-label"></div>
            </div>
            <div class="riftbound-bf-slot" data-slot="right-2">
                <img class="riftbound-bf-img" src="" alt="">
                <div class="riftbound-bf-label"></div>
            </div>
        </div>
    </div>
</div>

<!-- Star Wars Scoreboard -->
<div id="scoreboard-starwars" style="display: none;">
    <video class="starwars-bg-video" autoplay loop muted playsinline>
        <source src="/assets/images/starwars/overlay/bg loop.mp4" type="video/mp4">
    </video>
    <div class="starwars-frame"></div>

    <!-- Player Names -->
    <div class="swu-player-name-left"><span id="player-name-left"></span><span id="player-name-left-2" class="swu-player-name-2 player-name-2"></span></div>
    <div class="swu-player-name-right"><span id="player-name-right"></span><span id="player-name-right-2" class="swu-player-name-2 player-name-2"></span></div>

    <!-- Player Records -->
    <div class="swu-player-record-left"><span id="player-record-left"></span></div>
    <div class="swu-player-record-right"><span id="player-record-right"></span></div>

    <!-- Player Wins Pips -->
    <div class="swu-player-wins-left">
        <div id="swu-wins-left-1" class="swu-wins-pip"></div>
        <div id="swu-wins-left-2" class="swu-wins-pip"></div>
    </div>
    <div class="swu-player-wins-right">
        <div id="swu-wins-right-1" class="swu-wins-pip"></div>
        <div id="swu-wins-right-2" class="swu-wins-pip"></div>
    </div>

    <!-- Event Round -->
    <div class="swu-event-round"><span id="event-round"></span></div>

    <!-- Timer -->
    <div class="swu-timer-wrapper">
        <div class="timer-container">
            <p id="timer" class="swu-timer">00:00</p>
        </div>
    </div>

    <!-- Left Leader -->
    <div class="swu-leader-name-left"><span id="player-leader-left"></span></div>
    <div class="swu-leader-image-left"><img id="swu-leader-image-left" src="" alt=""></div>
    <div class="swu-leader-aspects-left" id="swu-leader-aspects-left"></div>

    <!-- Right Leader -->
    <div class="swu-leader-name-right"><span id="player-leader-right"></span></div>
    <div class="swu-leader-image-right"><img id="swu-leader-image-right" src="" alt=""></div>
    <div class="swu-leader-aspects-right" id="swu-leader-aspects-right"></div>

    <!-- Left Base -->
    <div class="swu-base-name-left"><span id="player-base-left"></span></div>
    <div class="swu-base-image-left"><img id="swu-base-image-left" src="" alt=""></div>
    <div class="swu-base-aspects-left" id="swu-base-aspects-left"></div>

    <!-- Right Base -->
    <div class="swu-base-name-right"><span id="player-base-right"></span></div>
    <div class="swu-base-image-right"><img id="swu-base-image-right" src="" alt=""></div>
    <div class="swu-base-aspects-right" id="swu-base-aspects-right"></div>

    <!-- Base Stats (damage/hp) -->
    <div class="swu-base-stats-left" id="swu-base-stats-left"></div>
    <div class="swu-base-stats-right" id="swu-base-stats-right"></div>

    <!-- Card View Overlays (shown on top of leader/base when card is viewed) -->
    <div class="swu-card-overlay swu-card-overlay-left" id="swu-card-overlay-left" style="display: none;">
        <img id="swu-card-overlay-img-left" src="" alt="">
    </div>
    <div class="swu-card-overlay swu-card-overlay-right" id="swu-card-overlay-right" style="display: none;">
        <img id="swu-card-overlay-img-right" src="" alt="">
    </div>
</div>

<script type="module" src="/js/scoreboard.js"></script>

</body>
</html>
