<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>Broadcast Metagame</title>
    <link href="/lib/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/lib/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/room-manager.js"></script>
    <script src="/js/vendor-config.js"></script>
    <script src="/lib/d3/d3.min.js"></script>

    <link href="/css/fonts.css" rel="stylesheet">
    <link href="/css/broadcast-metagame.css" rel="stylesheet">
</head>
<body>
<img id="metagame-bg" src="" alt="">
<video id="metagame-bg-video" autoplay loop muted playsinline></video>
<!-- "Most Played Decks" corner-leaves overlay — the only remaining chrome image
     (card frames / headline / footer are all CSS now). Sits above the bg, below
     the cards. Hidden (src="") for vendors using the pie-chart layout below. -->
<img id="metagame-leaves" src="" alt="">
<div id="metagame-container">
    <div id="metagame-header">
        <!-- Title shows via CSS unless a layout sets --meta-title-display: none
             (e.g. TES, which has METAGAME baked into the bg PNG). -->
        <div id="metagame-title">METAGAME</div>
        <!-- Default subtitle text — overwritten by JS when metagame data
             arrives ("DAY 1" if day-1 only, "DAY 2" if day-2 data exists).
             Hardcoded here so the subtitle is visible immediately when the
             URL loads, before any data has been broadcast. -->
        <div id="metagame-subtitle">DAY 1</div>
    </div>
    <div id="metagame-content">
        <div id="pie-chart-container">
            <svg id="pie-chart"></svg>
        </div>
        <div id="archetype-cards-panel">
        </div>
    </div>
    <!-- "Most Played Decks" — CSS-recreated 8-card metagame (CSL default + uvs).
         Headline + footer are static here; #mpd-cards is filled by
         renderMostPlayedDecks() (top 8 archetypes), and the DAY text is updated live. -->
    <div id="most-played-decks">
        <!-- Dynamic central figure: the #1 most-played legend, in front of the
             portal bg and behind the headline/cards. Src set by renderMostPlayedDecks().
             Legends with animated art use the <video> (transparent VP9 webm); the rest
             fall back to the static <img> PNG. Only one is visible at a time. -->
        <img id="mpd-character" src="" alt="">
        <video id="mpd-character-video" autoplay loop muted playsinline></video>
        <!-- Pixel-perfect PSD card-frame chrome (behind the per-card data) -->
        <div id="mpd-chrome"></div>
        <div class="mpd-headline">
            <div class="mpd-headline-top">MOST PLAYED</div>
            <div class="mpd-headline-main">DECKS</div>
        </div>
        <div id="mpd-cards"></div>
        <div class="mpd-footer">
            <div class="mpd-footer-bar"></div>
            <div class="mpd-footer-line left"></div>
            <div class="mpd-footer-line right"></div>
            <img class="mpd-footer-logo" src="" alt="">
            <div class="mpd-footer-pill">METAGAME</div>
            <div class="mpd-footer-day">DAY 1</div>
            <div class="mpd-footer-share">SHARE YOUR STORY</div>
            <div class="mpd-footer-hash"><span class="mpd-hash-rq">#RQ</span>Sydney</div>
        </div>
    </div>
</div>
<script type="module" src="/js/broadcast-metagame.js"></script>
</body>
</html>
