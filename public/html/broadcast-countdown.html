<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>Broadcast Countdown</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/room-manager.js"></script>
    <script src="/js/vendor-config.js"></script>

    <link href="/css/fonts.css" rel="stylesheet">
    <link href="/css/broadcast-countdown.css" rel="stylesheet">
    <link href="/css/unleashed-motion.css" rel="stylesheet">
    <script src="/js/unleashed-motion.js"></script>
</head>
<body>
<div id="countdown-stage">
    <!-- Everything except the ticking timer is baked into this one bg:
         painted background + rift portal + vines/plants + Vi + FX glow,
         RQ Sydney logo, WELCOME RIFTBOUNDERS / divider / THE BATTLE IS
         ABOUT TO BEGIN, and the SHARE YOUR STORY / #RQSYDNEY footer.
         (Derived from the PSD composite — adjustment layers made a
         re-composite unusable — with the sample "23:11" inpainted out.) -->
    <img id="countdown-bg" class="unl-fade" src="/assets/images/riftbound/countdown/riftbound-countdown-bg-uvs-unleashed-1v1.png" alt="">
    <!-- Optional caption (only shown when a `label` is provided via JSON/URL);
         sits in the gap between the RQ logo and the timer. -->
    <div id="countdown-label" class="unl-fade-rise" style="--unl-d:.34s"></div>
    <!-- The one dynamic element: ticking timer. Hardcoded to the PSD's own
         sample ("23:11") so the page paints correctly before JS runs.
         unl-scale-in runs ONCE on load; ticks only set textContent on this
         same element, which never restarts a CSS animation. -->
    <div id="countdown-timer" class="unl-scale-in" style="--unl-d:.18s">23:11</div>
</div>
<script type="module" src="/js/broadcast-countdown.js"></script>
</body>
</html>
